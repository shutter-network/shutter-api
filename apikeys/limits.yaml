# Rate limiting policy for the Shutter API.
#
# apikeys.py compiles this file, together with the API keys in keys.csv, into the
# Caddy snippet that the caddy container imports. Editing a number here and
# restarting the stack is the whole workflow — there is no other place limits are
# configured.
#
# A limit is `endpoint base × tier multiplier`. All counts are requests per
# `window`.

window: 1d

tiers:
  # Requests carrying no valid API key. Counted per source IP, because there is
  # no key to count against. Its matcher is generated by inverting every known
  # key, so no key is ever assigned to this tier.
  #
  # Multiplier 1 makes the bases below the anonymous allowance by definition.
  unauthorized:
    matcher: "@noApiKey"
    key: "{remote_host}"
    multiplier: 1

  # What every API key gets unless keys.csv says otherwise. base × 100 is the set
  # of values published in README.md — keep the two in sync.
  standard:
    matcher: "@standardApiKey"
    key: "{header.Authorization}"
    multiplier: 100

  # Raised limits for customers running continuously rather than experimenting.
  # Assign by putting `premium` in the tier column of keys.csv.
  #
  # 5x standard covers roughly one round per minute on the time-based endpoints:
  # 1440 registrations/day fits under 2500, and polling for the key at ~4 reads
  # per round fits under 10000.
  premium:
    matcher: "@premiumApiKey"
    key: "{header.Authorization}"
    multiplier: 500

# One entry per rate-limited endpoint. `base` is the unauthenticated allowance;
# every tier scales from it.
endpoints:
  # Registration is a transaction paid from our signer, so this limit is a
  # spending ceiling as much as a rate limit.
  - name: register_identity
    path: "*/time/register_identity*"
    method: POST
    base: 5

  - name: get_data_for_encryption
    path: "*/time/get_data_for_encryption*"
    method: GET
    base: 10

  # Polled repeatedly per round, so it sits well above the registration limit.
  - name: get_decryption_key
    path: "*/time/get_decryption_key*"
    method: GET
    base: 20

  - name: decrypt_commitment
    path: "*/decrypt_commitment*"
    method: GET
    base: 10

  - name: compile_event_trigger_definition
    path: "*/event/compile_trigger_definition*"
    method: POST
    base: 20

  # As with the time-based one, each registration spends gas.
  - name: register_event_identity
    path: "*/event/register_identity*"
    method: POST
    base: 5

  - name: get_event_trigger_expiration_block
    path: "*/event/get_trigger_expiration_block*"
    method: GET
    base: 20

  - name: get_event_decryption_key
    path: "*/event/get_decryption_key*"
    method: GET
    base: 20

  - name: event_get_data_for_encryption
    path: "*/event/get_data_for_encryption*"
    method: GET
    base: 10